<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora TypeScript CI/CD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31104b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f8fafc;
    }

    .calculator-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      padding: 36px 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 28px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="number"], select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 1rem;
      color: #f8fafc;
      background-color: rgba(15, 23, 42, 0.6);
      transition: all 0.25 ease;
    }

    select option {
      background-color: #1e293b;
      color: #f8fafc;
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: #818cf8;
      background-color: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.25);
    }

    .calculate-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
    }

    .calculate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(168, 85, 247, 0.4);
    }

    .calculate-btn:active {
      transform: translateY(0);
    }

    .result-box {
      margin-top: 28px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(129, 140, 248, 0.2);
      border-radius: 16px;
      text-align: center;
    }

    .result-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    #result {
      font-size: 1.75rem;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
    }

    .error-text {
      color: #f87171 !important;
      font-size: 1.1rem !important;
    }
  </style>
</head>
<body>
  <div class="calculator-card">
    <h1>Calculadora TypeScript</h1>
    <p class="subtitle">CI/CD con GitHub Actions & GitHub Pages</p>

    <div class="form-group">
      <label for="operation">Operación</label>
      <select id="operation">
        <option value="add">Suma (+)</option>
        <option value="subtract">Resta (−)</option>
        <option value="multiply">Multiplicación (×)</option>
        <option value="divide">División (÷)</option>
      </select>
    </div>

    <div class="inputs-grid">
      <div class="form-group">
        <label for="num1">Número A</label>
        <input type="number" id="num1" placeholder="Ej: 10" step="any" />
      </div>

      <div class="form-group">
        <label for="num2">Número B</label>
        <input type="number" id="num2" placeholder="Ej: 2" step="any" />
      </div>
    </div>

    <button type="button" id="btnCalculate" class="calculate-btn">Calcular Resultado</button>

    <div class="result-box">
      <div class="result-label">Resultado</div>
      <strong id="result">—</strong>
    </div>
  </div>

  <!-- Scripts compilados -->
  <script src="sum.js"></script>
  <script src="subtract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>

  <script>
    function calculate() {
      var num1Input = document.getElementById('num1').value;
      var num2Input = document.getElementById('num2').value;
      var resultElement = document.getElementById('result');
      var op = document.getElementById('operation').value;

      resultElement.classList.remove('error-text');

      if (num1Input === '' || num2Input === '') {
        resultElement.textContent = 'Por favor ingresa ambos números';
        resultElement.classList.add('error-text');
        return;
      }

      var a = Number(num1Input);
      var b = Number(num2Input);

      if (isNaN(a) || isNaN(b)) {
        resultElement.textContent = 'Valores inválidos';
        resultElement.classList.add('error-text');
        return;
      }

      try {
        var res;
        switch (op) {
          case 'add':
            res = window.sum(a, b);
            break;
          case 'subtract':
            res = window.subtract(a, b);
            break;
          case 'multiply':
            res = window.multiply(a, b);
            break;
          case 'divide':
            res = window.divide(a, b);
            break;
          default:
            res = window.sum(a, b);
        }
        resultElement.textContent = res;
      } catch (err) {
        resultElement.textContent = err.message || 'Error en la operación';
        resultElement.classList.add('error-text');
      }
    }

    document.getElementById('btnCalculate').addEventListener('click', calculate);

    // Permite presionar Enter para calcular
    document.getElementById('num1').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') calculate();
    });
    document.getElementById('num2').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') calculate();
    });
  </script>
</body>
</html>
