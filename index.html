<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sum Two Numbers :) </title>
</head>
<body>
  <h1>Sum Two Int Numbers =) </h1>
  <input type="number" id="num1" placeholder="First number" />
  <input type="number" id="num2" placeholder="Second number" />

  <br /><br />
  <button type="button" id="btnSum">Sum</button>
  <button type="button" id="btnSubtract">Subtract</button>
  <button type="button" id="btnMultiply">Multiply</button>
  <button type="button" id="btnDivide">Divide</button>

  <p>Result: <strong id="result">—</strong></p>

  <!-- Link to compiled JS scripts -->
  <script src="sum.js"></script>
  <script src="subtract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>
  <script>
    function getNumbers() {
      var val1 = document.getElementById('num1').value;
      var val2 = document.getElementById('num2').value;
      return {
        a: val1 === '' ? 0 : Number(val1),
        b: val2 === '' ? 0 : Number(val2)
      };
    }

    document.getElementById('btnSum').addEventListener('click', function () {
      var nums = getNumbers();
      document.getElementById('result').textContent = window.sum(nums.a, nums.b);
    });

    document.getElementById('btnSubtract').addEventListener('click', function () {
      var nums = getNumbers();
      document.getElementById('result').textContent = window.subtract(nums.a, nums.b);
    });

    document.getElementById('btnMultiply').addEventListener('click', function () {
      var nums = getNumbers();
      document.getElementById('result').textContent = window.multiply(nums.a, nums.b);
    });

    document.getElementById('btnDivide').addEventListener('click', function () {
      var nums = getNumbers();
      try {
        document.getElementById('result').textContent = window.divide(nums.a, nums.b);
      } catch (error) {
        document.getElementById('result').textContent = error.message;
      }
    });
  </script>
</body>
</html>
